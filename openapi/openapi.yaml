openapi: 3.0.3
info:
  title: Todo API
  version: "1.0.0"
paths:
# ==================
# === /API/TODOS ===
# ==================
  /api/todos:
    get:
      operationId: listTodos
      summary: List all todos
      tags: [ Todos ]
      responses:
        "200":
          description: The list of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
    post:
      operationId: createTodo
      summary: Create a new todo
      tags: [ Todos ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Todo"
      responses:
        "201":
          description: The todo was created

  /api/todos/{id}:
    get:
      operationId: getTodoById
      summary: Get a todo by id
      tags: [ Todos ]
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: The todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          description: No todo with that id
    put:
      operationId: updateTodo
      summary: Update a todo by id
      tags: [ Todos ]
      parameters:
        - $ref: "#/components/parameters/TodoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Todo"
      responses:
        "204":
          description: The todo was updated
        "404":
          description: No todo with that id
    delete:
      operationId: deleteTodo
      summary: Delete a todo by id
      tags: [ Todos ]
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "204":
          description: The todo was deleted
        "404":
          description: No todo with that id
# ==================
# === COMPONENTS ===
# ==================
components:
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Todo:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        completed:
          type: boolean
quarkus:
  index-dependency:
    openapi:
      group-id: com.hansterhorst
      artifact-id: openapi
  http:
    port: 22111
    cors:
      enabled: true
      origins: ${CORS_ORIGIN:http://localhost:22112}
    access-log:
      enabled: true
  hibernate-orm:
    schema-management:
      strategy: validate
  flyway:
    enabled: true
    migrate-at-start: true
    locations: classpath:db/migration
    schemas: public
  smallrye-health:
    root-path: /health

"%dev":
  quarkus:
    datasource:
      db-kind: postgresql
      username: ${DB_USERNAME:hansth}
      password: ${DB_PASSWORD:password}
      jdbc:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/hansth}

"%prod":
  quarkus:
    datasource:
      db-kind: postgresql
      username: ${DB_USERNAME:todo}
      password: ${DB_PASSWORD:todo}
      jdbc:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/todo}
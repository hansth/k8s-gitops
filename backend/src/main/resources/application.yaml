quarkus:
  index-dependency:
    openapi:
      group-id: com.hansterhorst
      artifact-id: openapi
  http:
    port: 22111
    # The frontend's nginx/Vite proxy forwards /api same-origin from the browser's
    # point of view (see frontend/nginx.conf.template), so CORS enforcement here
    # is unneeded and was rejecting requests with a stale allow-listed origin.
    cors:
      enabled: false
    access-log:
      enabled: true
  hibernate-orm:
    schema-management:
      strategy: validate
  flyway:
    enabled: true
    migrate-at-start: true
    locations: classpath:db/migration
    schemas: public
  smallrye-health:
    root-path: /health

"%dev":
  quarkus:
    datasource:
      db-kind: postgresql
      username: ${DB_USERNAME:hansth}
      password: ${DB_PASSWORD:password}
      jdbc:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/hansth}

"%prod":
  quarkus:
    datasource:
      db-kind: postgresql
      username: ${DB_USERNAME:todo}
      password: ${DB_PASSWORD:todo}
      jdbc:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/todo}

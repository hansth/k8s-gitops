apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/frontend

patches:
  # always pull the latest published image instead of the base's pinned version
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "ghcr.io/hansth/todo-frontend:latest"
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: dev-todo-cluster
servers: 1
#agents: 1
ports:
  # expose loadbalancer from outside the devcontainer
  - port: 22111:22111
    nodeFilters:
      - loadbalancer
  - port: 22112:22112
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # disable traefik ingress controller
      - arg: --disable=traefik
        nodeFilters:
          - server:*

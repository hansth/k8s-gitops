name: Build and Push Docker Images

# Runs when Release Please creates a release tag (backend-v0.2.0, frontend-v0.1.1).
# Tags created with GITHUB_TOKEN don't start workflows; Release Please uses its own token, so these do.
on:
  push:
    tags:
      - 'backend-v*'
      - 'frontend-v*'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/todo-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/todo-frontend

jobs:
  build-and-push-backend:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    # Only run for backend tags
    if: startsWith(github.ref, 'refs/tags/backend-v')
    permissions:
      contents: read
      packages: write # to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # backend-v0.2.0 -> 0.2.0
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#backend-v}" >> "$GITHUB_OUTPUT"

      # Built from the project root, because the image needs the openapi module too
      - name: Build and push backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          # Links the image to this repository on GitHub
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

  build-and-push-frontend:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    # Only run for frontend tags
    if: startsWith(github.ref, 'refs/tags/frontend-v')
    permissions:
      contents: read
      packages: write # to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # frontend-v0.1.1 -> 0.1.1
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#frontend-v}" >> "$GITHUB_OUTPUT"

      # Built from the project root, because the image needs the openapi package too
      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          # Links the image to this repository on GitHub
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}

name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'openapi/**'
      - '.github/workflows/backend-testing.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to post the coverage comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install openapi module
        run: ./backend/mvnw -f pom.xml -pl openapi -am -B install -DskipTests -Dexec.skip=true

      - name: Check formatting
        run: ./backend/mvnw -f backend/pom.xml -B spotless:check

      - name: Check style
        run: ./backend/mvnw -f backend/pom.xml -B checkstyle:check

      # Runs unit and integration tests, and writes the coverage report to backend/target/jacoco-report/
      - name: Run tests with coverage
        run: ./backend/mvnw -f backend/pom.xml -B verify -DskipITs=false

      # Download it from the workflow run page and open index.html
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/jacoco-report/

      # Shows the coverage as a comment on the pull request and on the workflow run page
      - name: Coverage comment
        if: always() && hashFiles('backend/target/jacoco-report/jacoco.xml') != ''
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: backend/target/jacoco-report/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Backend coverage
          min-coverage-overall: 80
          update-comment: true
          comment-type: both

      - name: Run SpotBugs
        run: ./backend/mvnw -f backend/pom.xml -B spotbugs:check
